name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and Publish Tauri Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'الإصدار ${{ github.ref_name }} - منظومة تسجيل وتوزيع المحافظ المدرسية'
          releaseBody: |
            ## 🎒 منظومة تسجيل وتوزيع المحافظ المدرسية - الإصدار ${{ github.ref_name }}

            حزمة التثبيت الرسمية المعتمدة لمنظومة تسجيل وتوزيع المحافظ المدرسية. التطبيق يعمل بدون اتصال بالإنترنت (Offline) ويدعم أنظمة Windows (32-bit و 64-bit).

            ### 📦 ملفات التثبيت المرفقة:
            - **`Setup.exe` (NSIS Installer):** معالج تثبيت سريع وسهل لجميع إصدارات ويندوز.
            - **`*.msi` (Windows Installer):** حزمة تثبيت رسمية للمؤسسات والشبكات المحلية.

            ### 🌟 أهم مميزات الإصدار:
            - 📸 نظام الصور الشخصية وقص 1:1 التفاعلي مع دعم الماسح الضوئي (Scanner) والحفظ بصيغة WebP فائقة الخفة.
            - 🔐 نظام النسخ الاحتياطي المشفر والاسترجاع الآمن (`.scaid` - AES-256-GCM + SHA256) مع الحماية الوقائية قبل الاسترجاع.
            - 🔄 ميزة إعادة ضبط المصنع الآمنة المحمية بنسخة احتياطية استباقية.
            - ⚖️ إدارة الحالات الاجتماعية ونقاط الأولوية والاستحقاق.
            - 📊 إحصائيات بصرية متقدمة للسنوات والأطوار الدراسية ومتابعة نسب التسليم لحظياً.
            - 📥 توليد قوالب Excel تلقائية بقوائم منسدلة معتمدة للحالات الاجتماعية لمنع أخطاء الإدخال.
            - 🖨️ طباعة متقدمة للاستمارات الفردية والمحاضر الجماعية مع هوية وشعار الجمعية.
          releaseDraft: false
          prerelease: false
          args: --target i686-pc-windows-msvc
