[package]
name = "school-aid-app"
version = "1.6.0"
description = "School Aid Management Desktop App"
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "shell-open", "dialog-save", "dialog-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.29", features = ["bundled"] }
aes-gcm = "0.10"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
sha2 = "0.10"
chrono = "0.4"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
